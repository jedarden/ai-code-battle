# acb-armor-credentials: ExternalSecret for ARMOR/B2 credentials
# Pulls bucket, auth-access-key, auth-secret-key from OpenBao at rs-manager/iad-acb/armor
#
# Staging file — sync to declarative-config/k8s/apexalgo-iad/ai-code-battle/
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acb-armor-credentials
  namespace: ai-code-battle
  labels:
    app.kubernetes.io/name: acb-armor-credentials
    app.kubernetes.io/part-of: ai-code-battle
    app.kubernetes.io/component: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: acb-armor-credentials
    creationPolicy: Owner
  data:
    - secretKey: bucket
      remoteRef:
        key: rs-manager/iad-acb/armor
        property: bucket
    - secretKey: auth-access-key
      remoteRef:
        key: rs-manager/iad-acb/armor
        property: auth-access-key
    - secretKey: auth-secret-key
      remoteRef:
        key: rs-manager/iad-acb/armor
        property: auth-secret-key
